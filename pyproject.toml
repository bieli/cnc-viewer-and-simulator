[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-viewer-and-simulator"
version = "1.3.0"
description = "Desktop G-code viewer for validating CNC CAM toolpaths from FreeCAD and other CAM tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Marcin Bielak" },
  { name = "Johannes Hagspiel" },
]
keywords = ["gcode", "cnc", "cam", "freecad", "viewer", "validation", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyQt5",
  "PyOpenGL",
  "PyOpenGL-accelerate",
  "matplotlib",
  "pyqtgraph>=0.12.4,<0.14",
  "numpy>=1.22",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "mypy>=1.8",
  "types-PyYAML",
]

[project.scripts]
gcode-viewer = "gcode_viewer.main:main"

[project.urls]
Homepage = "https://github.com/bieli/cnc-viewer-and-simulator"
Issues = "https://github.com/bieli/cnc-viewer-and-simulator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcode_viewer = ["resources/icons/*", "resources/settings/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["gcode_viewer"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
  "PyQt5.*",
  "pyqtgraph.*",
  "matplotlib.*",
]
ignore_missing_imports = true
